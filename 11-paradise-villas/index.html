<!-- 3. The app. You normally never need to touch anything below. -->
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* If config.js is missing or has a syntax error, say so in plain language
   instead of showing a blank white page. */
if (!window.SITE_CONFIG || !window.SITE_CONFIG.rooms) {
  document.getElementById('root').innerHTML =
    '<div style="font:16px/1.7 system-ui,sans-serif;max-width:620px;margin:14vh auto;padding:0 24px;color:#1a1a2e">'
    + '<h1 style="font-size:1.4rem;margin-bottom:14px">config.js could not be read</h1>'
    + '<p style="margin-bottom:14px">The page loaded, but its content file did not. Two usual causes:</p>'
    + '<ol style="margin:0 0 18px 20px">'
    + '<li style="margin-bottom:8px"><b>A typo in config.js</b> — a missing comma, quote or brace. '
    + 'Open the browser console (F12) to see the exact line.</li>'
    + '<li style="margin-bottom:8px"><b>config.js is not next to index.html</b> — both files must sit in the same folder.</li>'
    + '</ol>'
    + '<p style="color:#687084;font-size:.92rem">Tip: edit content through <b>admin.html</b> to avoid syntax mistakes entirely.</p>'
    + '</div>';
  throw new Error('SITE_CONFIG missing - see the message rendered on the page.');
}

const CFG = window.SITE_CONFIG;

/* ---------- helpers ---------------------------------------------- */
const money = n => {
  if (n === 0) return 'Free';
  return CFG.booking.currency + Number(n).toLocaleString('en-IN');
};
const todayISO = (plus = 0) => {
  const d = new Date();
  d.setDate(d.getDate() + plus);
  return d.toISOString().slice(0, 10);
};
const nightsBetween = (a, b) => {
  if (!a || !b) return 0;
  const ms = new Date(b) - new Date(a);
  return ms > 0 ? Math.round(ms / 86400000) : 0;
};
const initials = name => name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();

// Inline SVG shown when a remote photo fails to load.
const placeholder = (label) => {
  const t = CFG.theme;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${t.primary}"/><stop offset="1" stop-color="${t.secondary}"/>
    </linearGradient></defs>
    <rect width="800" height="600" fill="url(#g)"/>
    <text x="400" y="296" font-family="system-ui,sans-serif" font-size="30" font-weight="700"
      fill="rgba(255,255,255,.92)" text-anchor="middle">${label}</text>
    <text x="400" y="336" font-family="system-ui,sans-serif" font-size="17"
      fill="rgba(255,255,255,.6)" text-anchor="middle">Replace this in config.js</text>
  </svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
};

function Img({ src, alt, label, ...rest }) {
  const onErr = e => {
    if (e.target.dataset.fb) return;
    e.target.dataset.fb = '1';
    e.target.src = placeholder(label || alt || 'Add photo');
  };
  return <img src={src} alt={alt} loading="lazy" decoding="async" onError={onErr} {...rest} />;
}

/* ---------- hooks ------------------------------------------------- */
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal:not(.in)');
    if (!('IntersectionObserver' in window)) {
      els.forEach(el => el.classList.add('in'));
      return;
    }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -60px' });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  });
}

function useCountUp(target, run) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!run) return;
    const num = parseFloat(String(target).replace(/[^\d.]/g, '')) || 0;
    if (!num) { setVal(0); return; }
    let raf, start;
    const dur = 1500;
    const tick = t => {
      if (!start) start = t;
      const p = Math.min((t - start) / dur, 1);
      setVal(num * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, run]);
  const str = String(target);
  const dec = (str.match(/\.(\d+)/) || [, ''])[1].length;
  return str.replace(/[\d.]+/, val.toFixed(dec));
}

/* ---------- toasts ------------------------------------------------ */
const ToastCtx = React.createContext(() => {});
function ToastHost({ children }) {
  const [list, setList] = useState([]);
  const push = useCallback((text, icon = '✓') => {
    const id = Date.now() + Math.random();
    setList(l => [...l, { id, text, icon }]);
    setTimeout(() => setList(l => l.filter(t => t.id !== id)), 3600);
  }, []);
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="toasts" role="status" aria-live="polite">
        {list.map(t => <div className="toast" key={t.id}><span>{t.icon}</span><span>{t.text}</span></div>)}
      </div>
    </ToastCtx.Provider>
  );
}
const useToast = () => React.useContext(ToastCtx);

/* ---------- chrome ------------------------------------------------ */
function Preloader() {
  const [done, setDone] = useState(false);
  useEffect(() => {
    const t = setTimeout(() => setDone(true), 850);
    return () => clearTimeout(t);
  }, []);
  return (
    <div className={'preloader' + (done ? ' done' : '')} aria-hidden="true">
      <div className="preloader-inner">
        <div className="preloader-mark">{CFG.brand.name}</div>
        <div className="preloader-bar"><span /></div>
      </div>
    </div>
  );
}

function Progress() {
  const [w, setW] = useState(0);
  useEffect(() => {
    const on = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      setW(h > 0 ? (window.scrollY / h) * 100 : 0);
    };
    on();
    window.addEventListener('scroll', on, { passive: true });
    window.addEventListener('resize', on);
    return () => { window.removeEventListener('scroll', on); window.removeEventListener('resize', on); };
  }, []);
  return <div className="progress" style={{ width: w + '%' }} />;
}

function Nav({ onBook }) {
  const [solid, setSolid] = useState(false);
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const on = () => setSolid(window.scrollY > 60);
    on();
    window.addEventListener('scroll', on, { passive: true });
    return () => window.removeEventListener('scroll', on);
  }, []);
  useEffect(() => {
    document.body.style.overflow = open ? 'hidden' : '';
  }, [open]);
  const go = id => { setOpen(false); document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' }); };
  return (
    <nav className={'nav' + (solid ? ' solid' : '')}>
      <div className="nav-inner">
        <a href="#top" className="brand" onClick={e => { e.preventDefault(); go('top'); }}>
          {CFG.brand.name}
          <small>{CFG.brand.logoSub}</small>
        </a>
        <ul className={'nav-links' + (open ? ' open' : '')}>
          {CFG.nav.map(n => (
            <li key={n.id}><a href={'#' + n.id} onClick={e => { e.preventDefault(); go(n.id); }}>{n.label}</a></li>
          ))}
          <li>
            <a href="#book" className="nav-cta" onClick={e => { e.preventDefault(); setOpen(false); onBook(); }}>
              {CFG.labels.cta}
            </a>
          </li>
        </ul>
        <button className={'burger' + (open ? ' open' : '')} onClick={() => setOpen(o => !o)}
          aria-label="Menu" aria-expanded={open}>
          <span /><span /><span />
        </button>
      </div>
    </nav>
  );
}

/* ---------- hero -------------------------------------------------- */
function Hero({ onBook }) {
  const slides = CFG.hero.slides;
  const [i, setI] = useState(0);
  useEffect(() => {
    if (slides.length < 2) return;
    const t = setInterval(() => setI(v => (v + 1) % slides.length), 6000);
    return () => clearInterval(t);
  }, [slides.length]);
  const s = slides[i];
  return (
    <header className="hero" id="top">
      <div className="hero-media">
        {slides.map((sl, k) => (
          <div key={k} className={'hero-slide' + (k === i ? ' active' : '')}
            style={{ backgroundImage: `url('${sl.image}')` }} />
        ))}
        <div className="hero-scrim" />
      </div>
      <div className="hero-body">
        <div className="wrap">
          <div className="hero-badge"><i />{CFG.brand.type}{CFG.brand.city ? ' · ' + CFG.brand.city : ''}</div>
          <h1>{s.title}</h1>
          <p className="hero-lead">{s.subtitle}</p>
          <div className="hero-actions">
            <button className="btn btn-fill" onClick={onBook}>{CFG.labels.cta}</button>
            <a className="btn btn-ghost" href="#rooms"
              onClick={e => { e.preventDefault(); document.getElementById('rooms')?.scrollIntoView({ behavior: 'smooth' }); }}>
              {CFG.labels.browse}
            </a>
          </div>
          {slides.length > 1 && (
            <div className="hero-dots">
              {slides.map((_, k) => (
                <button key={k} className={k === i ? 'on' : ''} onClick={() => setI(k)}
                  aria-label={'Slide ' + (k + 1)} />
              ))}
            </div>
          )}
        </div>
      </div>
    </header>
  );
}

/* ---------- quick search ------------------------------------------ */
function QuickBar({ search, setSearch, onGo }) {
  if (CFG.layout.hideQuickBar) return null;
  const set = (k, v) => setSearch(s => ({ ...s, [k]: v }));
  return (
    <div className="quickbar">
      <div className="wrap">
        <div className="quickbar-inner">
          <div className="qfield">
            <label>{CFG.labels.checkIn}</label>
            <input type="date" value={search.checkIn} min={todayISO()}
              onChange={e => set('checkIn', e.target.value)} />
          </div>
          <div className="qfield">
            <label>{CFG.labels.checkOut}</label>
            <input type="date" value={search.checkOut} min={search.checkIn || todayISO(1)}
              onChange={e => set('checkOut', e.target.value)} />
          </div>
          <div className="qfield">
            <label>{CFG.labels.guests}</label>
            <select value={search.guests} onChange={e => set('guests', +e.target.value)}>
              {[1, 2, 3, 4, 5, 6].map(n => <option key={n} value={n}>{n} {n === 1 ? 'Guest' : 'Guests'}</option>)}
            </select>
          </div>
          <div className="qfield">
            <label>{CFG.labels.unitPlural}</label>
            <select value={search.units} onChange={e => set('units', +e.target.value)}>
              {[1, 2, 3, 4].map(n => <option key={n} value={n}>{n}</option>)}
            </select>
          </div>
          <button className="qgo" onClick={onGo}>{CFG.labels.search}</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- stats ------------------------------------------------- */
function Stats() {
  const [run, setRun] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !('IntersectionObserver' in window)) { setRun(true); return; }
    const io = new IntersectionObserver(e => { if (e[0].isIntersecting) { setRun(true); io.disconnect(); } }, { threshold: .4 });
    io.observe(ref.current);
    return () => io.disconnect();
  }, []);
  return (
    <section className="section" style={{ paddingBottom: 0 }}>
      <div className="wrap">
        <div className="stats reveal" ref={ref}>
          {CFG.stats.map((s, i) => <Stat key={i} {...s} run={run} />)}
        </div>
      </div>
    </section>
  );
}
function Stat({ number, label, run }) {
  const shown = useCountUp(number, run);
  return <div className="stat"><b>{shown}</b><span>{label}</span></div>;
}

/* ---------- rooms ------------------------------------------------- */
function Rooms({ onSelect, onDetails, faves, toggleFave }) {
  const [filter, setFilter] = useState('all');
  const [sort, setSort] = useState('featured');
  const list = useMemo(() => {
    let r = CFG.rooms.slice();
    if (filter === 'under') r = r.filter(x => x.price > 0 && x.price <= CFG.booking.midPrice);
    else if (filter === 'premium') r = r.filter(x => x.price > CFG.booking.midPrice);
    else if (filter === 'family') r = r.filter(x => x.capacity >= 4);
    else if (filter === 'faves') r = r.filter(x => faves.includes(x.id));
    if (sort === 'low') r.sort((a, b) => a.price - b.price);
    if (sort === 'high') r.sort((a, b) => b.price - a.price);
    return r;
  }, [filter, sort, faves]);

  return (
    <section className="section" id="rooms">
      <div className="wrap">
        <div className="section-head reveal">
          <span className="eyebrow">{CFG.labels.roomsEyebrow}</span>
          <h2>{CFG.labels.roomsTitle}</h2>
          <p>{CFG.labels.roomsBlurb}</p>
        </div>

        <div className="chips reveal">
          {CFG.filters.map(f => (
            <button key={f.id} className={'chip' + (filter === f.id ? ' on' : '')}
              onClick={() => setFilter(f.id)}>
              {f.label}{f.id === 'faves' && faves.length ? ' (' + faves.length + ')' : ''}
            </button>
          ))}
          <select className="chip" value={sort} onChange={e => setSort(e.target.value)}
            style={{ marginLeft: 'auto', cursor: 'pointer' }} aria-label="Sort">
            <option value="featured">Sort: Featured</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
          </select>
        </div>

        {list.length === 0 && (
          <p style={{ padding: '40px 0', color: 'var(--muted)' }}>
            Nothing matches that filter yet — try another one.
          </p>
        )}

        <div className="rooms">
          {list.map(r => (
            <article className="room reveal" key={r.id}>
              <div className="room-shot">
                <Img src={r.image} alt={r.name} label={r.name} />
                <span className="room-tag">{CFG.labels.unit}</span>
                <button className="fave" aria-label="Save"
                  onClick={() => toggleFave(r.id)}>{faves.includes(r.id) ? '♥' : '♡'}</button>
              </div>
              <div className="room-body">
                <h3>{r.name}</h3>
                <div className="room-meta">
                  <span>▢ {r.size}</span>
                  <span>☻ {r.capacity}</span>
                  <span>⬓ {r.beds}</span>
                </div>
                <p>{r.desc}</p>
                <div className="room-foot">
                  <div className="room-rate">
                    <b>{money(r.price)}</b>
                    <span>{CFG.labels.per}</span>
                  </div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button className="btn btn-line btn-sm" onClick={() => onDetails(r)}>Details</button>
                    <button className="btn btn-dark btn-sm" onClick={() => onSelect(r)}>{CFG.labels.ctaShort}</button>
                  </div>
                </div>
              </div>
            </article>
          ))}
        </div>
      </div>
    </section>
  );
}

function RoomModal({ room, onClose, onBook }) {
  const [shot, setShot] = useState(0);
  useEffect(() => {
    const k = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', k);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', k); document.body.style.overflow = ''; };
  }, [onClose]);
  if (!room) return null;
  const shots = room.gallery && room.gallery.length ? room.gallery : [room.image];
  return (
    <div className="modal-back" onClick={onClose} role="dialog" aria-modal="true">
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-shot">
          <Img src={shots[shot]} alt={room.name} label={room.name} />
          <button className="modal-x" onClick={onClose} aria-label="Close">✕</button>
          {shots.length > 1 && (
            <div className="modal-thumbs">
              {shots.map((s, i) => (
                <button key={i} className={i === shot ? 'on' : ''} onClick={() => setShot(i)}>
                  <Img src={s} alt="" label="" />
                </button>
              ))}
            </div>
          )}
        </div>
        <div className="modal-body">
          <h3>{room.name}</h3>
          <p style={{ color: 'var(--muted)' }}>{room.desc}</p>
          <div className="spec-grid">
            <div className="spec"><b>{CFG.labels.specSize}</b><span>{room.size}</span></div>
            <div className="spec"><b>{CFG.labels.specCap}</b><span>{room.capacity} {CFG.labels.specCapUnit}</span></div>
            <div className="spec"><b>{CFG.labels.specBeds}</b><span>{room.beds}</span></div>
            <div className="spec"><b>Rate</b><span>{money(room.price)} {CFG.labels.per}</span></div>
          </div>
          <h5 style={{ marginBottom: 12, fontSize: '.72rem', letterSpacing: '.18em', textTransform: 'uppercase', color: 'var(--muted)' }}>
            {CFG.labels.included}
          </h5>
          <div className="amen-tags">
            {room.amenities.map((a, i) => <span key={i}>{a}</span>)}
          </div>
          <div className="modal-foot">
            <div className="room-rate">
              <b style={{ fontSize: '1.7rem' }}>{money(room.price)}</b>
              <span>{CFG.labels.per}</span>
            </div>
            <button className="btn btn-fill" onClick={() => { onBook(room); onClose(); }}>
              {CFG.labels.cta}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function About() {

    <section className="section tint" id="about">
      <div className="wrap">
        <div className="about">
          <div className="about-copy reveal">
            <span className="eyebrow">{CFG.labels.aboutEyebrow}</span>
            <h2>{CFG.about.title}</h2>
            {CFG.about.paragraphs.map((p, i) => <p key={i}>{p}</p>)}

          <div className="about-shots reveal">

/* ---------- gallery ------------------------------------------------ */
function Gallery() {
  const [open, setOpen] = useState(-1);
  const items = CFG.gallery;
  useEffect(() => {
    if (open < 0) return;
    const k = e => {
      if (e.key === 'Escape') setOpen(-1);
      if (e.key === 'ArrowRight') setOpen(v => (v + 1) % items.length);
      if (e.key === 'ArrowLeft') setOpen(v => (v - 1 + items.length) % items.length);
    };
    window.addEventListener('keydown', k);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', k); document.body.style.overflow = ''; };
  }, [open, items.length]);

  return (
    <section className="section" id="gallery">
      <div className="wrap">
        <div className="section-head mid reveal">
          <span className="eyebrow">{CFG.labels.galleryEyebrow}</span>
          <h2>{CFG.labels.galleryTitle}</h2>
          <p>{CFG.labels.galleryBlurb}</p>
        </div>
        <div className="gallery reveal">
          {items.map((g, i) => (
            <figure className="gcell" key={i} onClick={() => setOpen(i)}>
              <Img src={g.image} alt={g.caption} label={g.caption} />
              <figcaption>{g.caption}</figcaption>
            </figure>
          ))}
        </div>
      </div>

      {open >= 0 && (
        <div className="lightbox" onClick={() => setOpen(-1)} role="dialog" aria-modal="true">
          <div onClick={e => e.stopPropagation()}>
            <Img src={items[open].image} alt={items[open].caption} label={items[open].caption} />
            <div className="lb-cap">{items[open].caption} &nbsp;·&nbsp; {open + 1} / {items.length}</div>
          </div>
          <button className="lb-x" onClick={() => setOpen(-1)} aria-label="Close">✕</button>
          <button className="lb-prev" aria-label="Previous"
            onClick={e => { e.stopPropagation(); setOpen((open - 1 + items.length) % items.length); }}>‹</button>
          <button className="lb-next" aria-label="Next"
            onClick={e => { e.stopPropagation(); setOpen((open + 1) % items.length); }}>›</button>
        </div>
      )}
    </section>
  );
}

/* ---------- testimonials -------------------------------------------- */
function Testimonials() {
  const t = CFG.testimonials;
  const [i, setI] = useState(0);
  const [paused, setPaused] = useState(false);
  useEffect(() => {
    if (paused || t.length < 2) return;
    const id = setInterval(() => setI(v => (v + 1) % t.length), 5500);
    return () => clearInterval(id);
  }, [paused, t.length]);
  const q = t[i];
  return (
    <section className="section tint" id="reviews"
      onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)}>
      <div className="wrap">
        <div className="section-head mid reveal">
          <span className="eyebrow">{CFG.labels.reviewsEyebrow}</span>
          <h2>{CFG.labels.reviewsTitle}</h2>
        </div>
        <div className="quote-wrap reveal">
          <div className="quote-mark">&ldquo;</div>
          <div className="quote-stars">{'★'.repeat(q.rating)}{'☆'.repeat(5 - q.rating)}</div>
          <p className="quote-text">{q.text}</p>
          <div className="quote-who">
            <div className="av">{initials(q.name)}</div>
            <div style={{ textAlign: 'left' }}>
              <b>{q.name}</b>
              <span>{q.title}</span>
            </div>
          </div>
          <div className="quote-nav">
            {t.map((_, k) => (
              <button key={k} className={k === i ? 'on' : ''} onClick={() => setI(k)}
                aria-label={'Review ' + (k + 1)} />
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

    <section className="section" id="faq">
      <div className="wrap">

/* ---------- booking engine -------------------------------------------- */
const BLANK_GUEST = { name: '', email: '', phone: '', notes: '' };

function Booking({ search, setSearch, picked, setPicked }) {
  const toast = useToast();
  const [step, setStep] = useState(0);
  const [guest, setGuest] = useState(BLANK_GUEST);
  const [errors, setErrors] = useState({});
  const [ref, setRef] = useState('');

  const nights = Math.max(nightsBetween(search.checkIn, search.checkOut), CFG.booking.minNights);
  const room = CFG.rooms.find(r => r.id === picked) || CFG.rooms[0];
  const subtotal = room.price * nights * search.units;
  const tax = Math.round(subtotal * CFG.booking.taxRate);
  const fee = subtotal > 0 ? CFG.booking.serviceFee : 0;
  const total = subtotal + tax + fee;

  const validateDates = () => {
    const e = {};
    if (!search.checkIn) e.checkIn = 'Pick a date';
    if (!search.checkOut) e.checkOut = 'Pick a date';
    if (search.checkIn && search.checkOut && nightsBetween(search.checkIn, search.checkOut) < 1)
      e.checkOut = 'Must be after check-in';
    if (room.capacity * search.units < search.guests)
      e.guests = `That is more guests than ${search.units} ${search.units > 1 ? CFG.labels.unitPlural.toLowerCase() : CFG.labels.unit.toLowerCase()} can take`;
    setErrors(e);
    return Object.keys(e).length === 0;
  };
  const validateGuest = () => {
    const e = {};
    if (guest.name.trim().length < 2) e.name = 'Enter your full name';
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(guest.email)) e.email = 'Enter a valid email';
    if (guest.phone.replace(/\D/g, '').length < 8) e.phone = 'Enter a valid phone number';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const next = () => {
    if (step === 0 && !validateDates()) return;
    if (step === 2 && !validateGuest()) return;
    setErrors({});
    setStep(s => s + 1);
  };

  const confirm = () => {
    const code = CFG.booking.refPrefix + '-' + Math.random().toString(36).slice(2, 7).toUpperCase();
    setRef(code);
    try {
      const all = JSON.parse(localStorage.getItem('bookings') || '[]');
      all.push({
        ref: code, room: room.name, ...search, guest, total, nights,
        placedAt: new Date().toISOString()
      });
      localStorage.setItem('bookings', JSON.stringify(all));
    } catch (_) { /* private mode — the confirmation still shows */ }
    setStep(4);
    toast(CFG.labels.confirmToast, '✓');
  };

  const reset = () => { setStep(0); setGuest(BLANK_GUEST); setRef(''); setErrors({}); };
  const set = (k, v) => setSearch(s => ({ ...s, [k]: v }));
  const fieldCls = k => 'field' + (errors[k] ? ' bad' : '');

  return (
    <section className="section" id="book">
      <div className="wrap">
        <div className="section-head mid reveal">
          <span className="eyebrow">{CFG.labels.bookEyebrow}</span>
          <h2>{CFG.labels.bookTitle}</h2>
          <p>{CFG.labels.bookBlurb}</p>
        </div>

        <div className="engine reveal">
          <div className="steps">
            {CFG.labels.steps.map((s, i) => (
              <div key={i} className={'step' + (i === step ? ' on' : '') + (i < step ? ' done' : '')}>
                <i>{i < step ? '✓' : i + 1}</i>{s}
              </div>
            ))}
          </div>

          <div className="engine-body">
            {step === 0 && (
              <>
                <div className="grid2">
                  <div className={fieldCls('checkIn')}>
                    <label>{CFG.labels.checkIn}</label>
                    <input type="date" value={search.checkIn} min={todayISO()}
                      onChange={e => set('checkIn', e.target.value)} />
                    {errors.checkIn && <div className="err">{errors.checkIn}</div>}
                  </div>
                  <div className={fieldCls('checkOut')}>
                    <label>{CFG.labels.checkOut}</label>
                    <input type="date" value={search.checkOut} min={search.checkIn || todayISO(1)}
                      onChange={e => set('checkOut', e.target.value)} />
                    {errors.checkOut && <div className="err">{errors.checkOut}</div>}
                  </div>
                </div>
                <div className="grid2" style={{ marginTop: 20 }}>
                  <div className={fieldCls('guests')}>
                    <label>{CFG.labels.guests}</label>
                    <select value={search.guests} onChange={e => set('guests', +e.target.value)}>
                      {[1, 2, 3, 4, 5, 6, 8, 10].map(n => <option key={n} value={n}>{n}</option>)}
                    </select>
                    {errors.guests && <div className="err">{errors.guests}</div>}
                  </div>
                  <div className="field">
                    <label>{CFG.labels.unitPlural}</label>
                    <select value={search.units} onChange={e => set('units', +e.target.value)}>
                      {[1, 2, 3, 4, 5].map(n => <option key={n} value={n}>{n}</option>)}
                    </select>
                  </div>
                </div>
                <p style={{ marginTop: 18, fontSize: '.86rem', color: 'var(--muted)' }}>
                  {nights} {nights === 1 ? CFG.labels.night : CFG.labels.nights} selected.
                </p>
              </>
            )}

            {step === 1 && (
              <div className="pick">
                {CFG.rooms.map(r => (
                  <div key={r.id} className={'pick-row' + (r.id === picked ? ' on' : '')}
                    onClick={() => setPicked(r.id)} role="button" tabIndex={0}
                    onKeyDown={e => e.key === 'Enter' && setPicked(r.id)}>
                    <Img src={r.image} alt={r.name} label="" />
                    <div>
                      <div className="pr-name">{r.name}</div>
                      <div className="pr-sub">{r.size} · {CFG.labels.upTo} {r.capacity}</div>
                    </div>
                    <div className="pr-rate">{money(r.price)}<br />
                      <span style={{ fontWeight: 500, fontSize: '.72rem', color: 'var(--muted)' }}>{CFG.labels.per}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {step === 2 && (
              <>
                <div className="grid2">
                  <div className={fieldCls('name')}>
                    <label>Full Name</label>
                    <input value={guest.name} placeholder="e.g. Ananya Sharma"
                      onChange={e => setGuest(g => ({ ...g, name: e.target.value }))} />
                    {errors.name && <div className="err">{errors.name}</div>}
                  </div>
                  <div className={fieldCls('email')}>
                    <label>Email</label>
                    <input type="email" value={guest.email} placeholder="you@example.com"
                      onChange={e => setGuest(g => ({ ...g, email: e.target.value }))} />
                    {errors.email && <div className="err">{errors.email}</div>}
                  </div>
                </div>
                <div className="grid2" style={{ marginTop: 20 }}>
                  <div className={fieldCls('phone')}>
                    <label>Phone</label>
                    <input type="tel" value={guest.phone} placeholder="+91 98765 43210"
                      onChange={e => setGuest(g => ({ ...g, phone: e.target.value }))} />
                    {errors.phone && <div className="err">{errors.phone}</div>}
                  </div>
                  <div className="field">
                    <label>Special Requests</label>
                    <input value={guest.notes} placeholder="Optional"
                      onChange={e => setGuest(g => ({ ...g, notes: e.target.value }))} />
                  </div>
                </div>
              </>
            )}

            {step === 3 && (
              <div className="summary">
                <div className="summary-row"><span>{CFG.labels.unit}</span><b>{room.name}</b></div>
                <div className="summary-row"><span>{CFG.labels.checkIn}</span><b>{search.checkIn}</b></div>
                <div className="summary-row"><span>{CFG.labels.checkOut}</span><b>{search.checkOut}</b></div>
                <div className="summary-row"><span>Guest</span><b>{guest.name}</b></div>
                <div className="summary-row">
                  <span>{money(room.price)} × {nights} {nights === 1 ? CFG.labels.night : CFG.labels.nights} × {search.units}</span>
                  <b>{money(subtotal)}</b>
                </div>
                <div className="summary-row"><span>Taxes &amp; fees ({Math.round(CFG.booking.taxRate * 100)}%)</span><b>{money(tax)}</b></div>
                {fee > 0 && <div className="summary-row"><span>Service fee</span><b>{money(fee)}</b></div>}
                <div className="summary-row total"><span>Total</span><b>{money(total)}</b></div>
                <p style={{ marginTop: 14, fontSize: '.82rem', color: 'var(--muted)' }}>
                  {CFG.labels.demoNote}
                </p>
              </div>
            )}

            {step === 4 && (
              <div style={{ textAlign: 'center', padding: '20px 0' }}>
                <div className="done-mark">✓</div>
                <h3 style={{ fontSize: '1.6rem' }}>{CFG.labels.confirmTitle}</h3>
                <div className="ref-code">{ref}</div>
                <p style={{ color: 'var(--muted)', maxWidth: '46ch', margin: '0 auto 8px' }}>
                  {CFG.labels.confirmBody}
                </p>
                <p style={{ color: 'var(--muted)', fontSize: '.9rem' }}>
                  <b>{room.name}</b> · {search.checkIn} → {search.checkOut} · {money(total)}
                </p>
                <button className="btn btn-line" style={{ marginTop: 26 }} onClick={reset}>
                  Make another booking
                </button>
              </div>
            )}

            {step < 4 && (
              <div className="engine-foot">
                <button className="btn btn-line" disabled={step === 0} onClick={() => setStep(s => s - 1)}>
                  Back
                </button>
                {step < 3
                  ? <button className="btn btn-fill" onClick={next}>Continue</button>
                  : <button className="btn btn-fill" onClick={confirm}>{CFG.labels.confirmCta}</button>}
              </div>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

/* ---------- contact + newsletter ---------------------------------------- */
function Contact() {
  const toast = useToast();
  const [email, setEmail] = useState('');
  const submit = e => {
    e.preventDefault();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)) { toast('Enter a valid email', '!'); return; }
    setEmail('');
    toast(CFG.labels.newsToast, '✓');
  };
  const b = CFG.brand;
  return (
    <section className="section tint" id="contact">
      <div className="wrap">
        <div className="section-head mid reveal">
          <span className="eyebrow">{CFG.labels.contactEyebrow}</span>
          <h2>{CFG.labels.contactTitle}</h2>
          <p>{CFG.labels.contactBlurb}</p>
        </div>
        <div className="contact-grid reveal">
          <div className="contact-card">
            <span className="ic">✆</span><h4>Phone</h4>
            <a href={'tel:' + b.phone.replace(/\s/g, '')}>{b.phone}</a>
          </div>
          <div className="contact-card">
            <span className="ic">✉</span><h4>Email</h4>
            <a href={'mailto:' + b.email}>{b.email}</a>
          </div>
          <div className="contact-card">
            <span className="ic">⌖</span><h4>Address</h4>
            <p>{b.address}</p>
          </div>
        </div>

        <div className="newsletter reveal" style={{ marginTop: 56 }}>
          <h3>{CFG.labels.newsTitle}</h3>
          <p>{CFG.labels.newsBlurb}</p>
          <form className="news-form" onSubmit={submit}>
            <input type="email" value={email} placeholder="your@email.com"
              onChange={e => setEmail(e.target.value)} aria-label="Email" />
            <button className="btn btn-fill" type="submit">Subscribe</button>
          </form>
        </div>
      </div>
    </section>
  );
}

/* ---------- footer ------------------------------------------------------ */
function Footer() {
  const b = CFG.brand;
  return (
    <footer className="footer">
      <div className="wrap">
        <div className="footer-grid">
          <div>
            <div className="brand">{b.name}<small>{b.logoSub}</small></div>
            <p>{b.description}</p>
            <div className="socials">
              {Object.entries(CFG.social).map(([k, v]) => (
                <a key={k} href={v} title={k} aria-label={k}>{k[0].toUpperCase()}</a>
              ))}
            </div>
          </div>
          {CFG.footerLinks.map(col => (
            <div key={col.title}>
              <h5>{col.title}</h5>
              <ul>
                {col.links.map(l => (
                  <li key={l.label}>
                    <a href={l.href} onClick={e => {
                      if (l.href.startsWith('#')) {
                        e.preventDefault();
                        document.getElementById(l.href.slice(1))?.scrollIntoView({ behavior: 'smooth' });
                      }
                    }}>{l.label}</a>
                  </li>
                ))}
              </ul>
            </div>
          ))}
          <div>
            <h5>Reach Us</h5>
            <ul>
              <li><a href={'tel:' + b.phone.replace(/\s/g, '')}>{b.phone}</a></li>
              <li><a href={'mailto:' + b.email}>{b.email}</a></li>
              <li><span style={{ fontSize: '.9rem', color: 'rgba(255,255,255,.6)' }}>{b.address}</span></li>
            </ul>
          </div>
        </div>
        <div className="footer-bottom">
          <span>© {new Date().getFullYear()} {b.name}. All rights reserved.</span>
          <span>{b.city} · {b.type}</span>
        </div>
      </div>
    </footer>
  );
}

/* ---------- floating ---------------------------------------------------- */
function Floaters() {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const on = () => setShow(window.scrollY > 700);
    window.addEventListener('scroll', on, { passive: true });
    return () => window.removeEventListener('scroll', on);
  }, []);
  const wa = CFG.brand.whatsapp.replace(/\D/g, '');
  return (
    <div className="floaters">
      <a className="fl-wa" href={`https://wa.me/${wa}?text=${encodeURIComponent(CFG.labels.waText)}`}
        target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">✆</a>
      <button className={'fl-top' + (show ? ' show' : '')} aria-label="Back to top"
        onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>↑</button>
    </div>
  );
}

/* ---------- app --------------------------------------------------------- */
function App() {
  const [search, setSearch] = useState({
    checkIn: todayISO(1), checkOut: todayISO(3), guests: 2, units: 1
  });
  const [picked, setPicked] = useState(CFG.rooms[0].id);
  const [details, setDetails] = useState(null);
  const [faves, setFaves] = useState(() => {
    try { return JSON.parse(localStorage.getItem('faves') || '[]'); } catch (_) { return []; }
  });
  const toast = useToast();
  useReveal();

  useEffect(() => {
    const t = CFG.theme, r = document.documentElement.style;
    Object.entries(t).forEach(([k, v]) => r.setProperty('--' + k, v));
  }, []);

  useEffect(() => {
    try { localStorage.setItem('faves', JSON.stringify(faves)); } catch (_) {}
  }, [faves]);

  const toggleFave = id => setFaves(f => f.includes(id) ? f.filter(x => x !== id) : [...f, id]);

  const jumpToBook = useCallback(room => {
    if (room) { setPicked(room.id); toast(`${room.name} selected`, '✓'); }
    document.getElementById('book')?.scrollIntoView({ behavior: 'smooth' });
  }, [toast]);

  return (
    <>
      <Preloader />
      <Progress />
      <Nav onBook={() => jumpToBook(null)} />
      <Hero onBook={() => jumpToBook(null)} />
      <QuickBar search={search} setSearch={setSearch}
        onGo={() => { document.getElementById('rooms')?.scrollIntoView({ behavior: 'smooth' }); toast(CFG.labels.searchToast, '✓'); }} />
      <Stats />
      <Rooms onSelect={jumpToBook} onDetails={setDetails} faves={faves} toggleFave={toggleFave} />
      <Amenities />
      <About />
      <Gallery />
      <Testimonials />
      <Booking search={search} setSearch={setSearch} picked={picked} setPicked={setPicked} />
      <Faq />
      <Contact />
      <Footer />
      <Floaters />
      {details && <RoomModal room={details} onClose={() => setDetails(null)} onBook={jumpToBook} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ToastHost><App /></ToastHost>
);
</script>
</body>
</html>
